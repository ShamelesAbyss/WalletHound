[package]
name = "wallet-hound"
description = "Deterministic, structured-entropy wallet-recovery engine (ETH + BTC)."
version = "1.0.0"
edition = "2021"
authors = ["WalletHound"]
license = "MIT"

[dependencies]
bip39 = "2.0"
bitcoin = "0.32"
secp256k1 = "0.29"
tiny-keccak = { version = "2.0", features = ["keccak"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.9"
num_cpus = "1.16"

[profile.release]
lto = true
